services:
  postgres:
    image: postgres:16-alpine
    container_name: zmp-chat-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: zmp_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
